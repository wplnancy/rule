name: Cleanup Stale Branches

on:
  schedule:
    # 每周日凌晨 2 点执行
    - cron: '0 2 * * 0'
  workflow_dispatch: # 支持手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale branches
        run: |
          echo "🔍 查找超过 30 天未更新的已合并分支..."
          
          # 获取所有远程分支
          git fetch --prune
          
          # 查找已合并到 main 的分支
          for branch in $(git branch -r --merged origin/main | grep -v 'main\|develop\|master' | sed 's/origin\///'); do
            # 获取分支最后更新时间
            last_commit_date=$(git log -1 --format=%ct origin/$branch 2>/dev/null || echo 0)
            current_date=$(date +%s)
            days_old=$(( ($current_date - $last_commit_date) / 86400 ))
            
            if [ $days_old -gt 30 ]; then
              echo "🗑️  删除分支: $branch (已闲置 $days_old 天)"
              git push origin --delete $branch || echo "⚠️  无法删除 $branch"
            fi
          done

      - name: Cleanup summary
        run: echo "✅ 分支清理完成"
